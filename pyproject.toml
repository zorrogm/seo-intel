[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-intel"
version = "0.1.0"
description = "Crawl a site and a competitor, find cannibalization, gaps and the best internal links, and write a fact-checked action plan."
requires-python = ">=3.9"
dependencies = ["httpx>=0.27", "selectolax>=0.3.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
seo-intel = "seo_intel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
